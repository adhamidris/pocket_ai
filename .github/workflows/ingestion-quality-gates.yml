name: Ingestion Quality Gates

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  table-ingestion-quality-gates:
    name: Table Ingestion Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./pocketai_django
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quality gate comparison
        working-directory: ./pocketai_django
        env:
          DJANGO_SETTINGS_MODULE: pocketai.settings
          DJANGO_SECRET_KEY: phase5-ci-secret-key
          DJANGO_DEBUG: "true"
        run: |
          mkdir -p docs/ingestion_snapshots/ci
          python manage.py compare_table_ingestion_snapshots \
            --baseline-json docs/ingestion/phase5_quality_gate_baseline.json \
            --candidate-json docs/ingestion/phase5_quality_gate_candidate.json \
            --label phase5_ci_gate \
            --output-dir docs/ingestion_snapshots/ci \
            --enforce-quality-gates

      - name: Upload quality gate scorecards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-quality-gate-scorecards
          path: |
            pocketai_django/docs/ingestion_snapshots/ci/*.json
            pocketai_django/docs/ingestion_snapshots/ci/*.md
          if-no-files-found: warn
