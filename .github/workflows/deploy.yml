# ==============================================================================
# CI/CD PIPELINE - Automated Testing & Deployment
# ==============================================================================
# GitHub Actions workflow for multi-tenant AI SaaS platform
# Triggers: Push to main, Pull requests

name: Deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==============================================================================
  # Job 1: Test & Validate
  # ==============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: pocketai_test
          POSTGRES_USER: pocketai
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./pocketai_django
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Django system checks
        working-directory: ./pocketai_django
        env:
          DJANGO_SETTINGS_MODULE: pocketai.settings
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          POSTGRES_DB: pocketai_test
          POSTGRES_USER: pocketai
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py check

      - name: Check migration drift
        working-directory: ./pocketai_django
        env:
          DJANGO_SETTINGS_MODULE: pocketai.settings
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          POSTGRES_DB: pocketai_test
          POSTGRES_USER: pocketai
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py makemigrations --check --dry-run
      
      - name: Run database migrations
        working-directory: ./pocketai_django
        env:
          DJANGO_SETTINGS_MODULE: pocketai.settings
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          POSTGRES_DB: pocketai_test
          POSTGRES_USER: pocketai
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py migrate --noinput
      
      - name: Run Django tests
        working-directory: ./pocketai_django
        env:
          DJANGO_SETTINGS_MODULE: pocketai.settings
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          POSTGRES_DB: pocketai_test
          POSTGRES_USER: pocketai
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py test --noinput
      
      - name: Run deployment checks
        working-directory: ./pocketai_django
        env:
          DJANGO_SETTINGS_MODULE: pocketai.settings
          DJANGO_SECRET_KEY: test-secret-key-minimum-50-chars-long-random-string-here
          POSTGRES_DB: pocketai_test
          POSTGRES_USER: pocketai
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          DJANGO_DEBUG: false
          ALLOWED_HOSTS: example.com
        run: |
          python manage.py check --deploy --fail-level ERROR

  # ==============================================================================
  # Job 2: Build & Push Docker Image
  # ==============================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./pocketai_django
          file: ./pocketai_django/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}

  # ==============================================================================
  # Job 3: Deploy to Staging (Optional)
  # ==============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment:
      name: staging
      url: https://staging.yourdomain.com
    
    steps:
      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging..."
          # Add your staging deployment commands here
          # Examples:
          # - Railway: railway up --service web --environment staging
          # - Render: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
          # - Fly.io: flyctl deploy --app pocketai-staging
          echo "✅ Staging deployment would run here"

  # ==============================================================================
  # Job 4: Deploy to Production (Manual Approval)
  # ==============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://yourdomain.com
    
    steps:
      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          # Add your production deployment commands here
          # Examples:
          # - Railway: railway up --service web --environment production
          # - Render: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
          # - Fly.io: flyctl deploy --app pocketai-production
          echo "✅ Production deployment would run here"
