<section id="mobile-app" class="bg-background pt-10 md:pt-12 pb-14 md:pb-16">
  <div class="container mx-auto px-6">
    <div class="relative overflow-hidden rounded-2xl p-6 md:p-8 shadow-premium bg-gradient-hero text-white">
      <div class="pointer-events-none absolute -top-10 -left-10 w-64 h-64 rounded-full bg-white/10 blur-3xl animate-pulse" aria-hidden="true"></div>
      <div class="pointer-events-none absolute -bottom-12 -right-12 w-72 h-72 rounded-full bg-white/10 blur-3xl animate-pulse" style="animation-delay:1.2s" aria-hidden="true"></div>
      <div class="relative flex flex-col md:flex-row items-center justify-between gap-6">
        <h3 class="text-2xl md:text-3xl font-semibold text-center md:text-left inline-flex items-center gap-2">
          <span aria-hidden="true">📱</span>
          <span>{{ section.title }}</span>
        </h3>
        <div class="flex gap-4 justify-center md:justify-end">
          {% for store in section.stores %}
            <a href="{{ store.href }}" class="group inline-flex items-center gap-3.5 rounded-xl border border-white/20 bg-white/10 px-6 py-3.5 shadow-sm hover:bg-white/15 transition duration-200 hover:-translate-y-0.5" aria-label="{{ store.label }}">
              {{ store.icon|safe }}
              <div class="leading-tight">
                <div class="text-[17px] font-semibold text-white">{{ store.label }}</div>
              </div>
            </a>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>
