{% load lucide %}
<section id="features" class="pt-16 md:pt-20 pb-10 md:pb-28 bg-background relative">
  <div class="pointer-events-none absolute inset-0 -z-10 overflow-hidden" aria-hidden="true">
    <svg class="absolute -top-6 left-1/2 -translate-x-1/2 w-[1200px] h-20 opacity-20" viewBox="0 0 1200 80" preserveAspectRatio="none">
      <defs>
        <linearGradient id="feat-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="hsl(240 100% 70%)"></stop>
          <stop offset="100%" stop-color="hsl(250 100% 75%)"></stop>
        </linearGradient>
      </defs>
      <path d="M0,40 C200,10 400,60 600,30 800,55 1000,25 1200,40" fill="none" stroke="url(#feat-grad-1)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 10">
        <animate attributeName="stroke-dashoffset" from="0" to="-300" dur="10s" repeatCount="indefinite"></animate>
      </path>
      <path d="M0,60 C250,30 450,70 700,40 900,65 1050,35 1200,55" fill="none" stroke="url(#feat-grad-1)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 12">
        <animate attributeName="stroke-dashoffset" from="0" to="-400" dur="16s" repeatCount="indefinite"></animate>
      </path>
    </svg>
    <svg class="absolute -bottom-6 left-1/2 -translate-x-1/2 w-[1200px] h-20 opacity-15" viewBox="0 0 1200 80" preserveAspectRatio="none">
      <defs>
        <linearGradient id="feat-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="hsl(250 100% 75%)"></stop>
          <stop offset="100%" stop-color="hsl(240 100% 70%)"></stop>
        </linearGradient>
      </defs>
      <path d="M0,20 C220,50 440,10 660,35 880,15 1040,45 1200,25" fill="none" stroke="url(#feat-grad-2)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 10">
        <animate attributeName="stroke-dashoffset" from="0" to="-320" dur="12s" repeatCount="indefinite"></animate>
      </path>
    </svg>
    <svg class="absolute left-[10%] top-[30%] w-3 h-3" viewBox="0 0 8 8">
      <circle cx="4" cy="4" r="3" fill="hsl(240 100% 70% / 0.35)">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"></animate>
      </circle>
    </svg>
    <svg class="absolute right-[12%] top-[55%] w-2.5 h-2.5" viewBox="0 0 8 8">
      <circle cx="4" cy="4" r="3" fill="hsl(250 100% 75% / 0.35)">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5.5s" repeatCount="indefinite"></animate>
      </circle>
    </svg>
  </div>

  <div class="container mx-auto px-6">
    <div class="text-center mb-10 md:mb-16 animate-fade-in">
      <h2 class="text-4xl lg:text-5xl font-bold text-foreground mb-5">
        {{ section.section_title_prefix }} <span class="text-gradient-hero">{{ section.section_title_highlight }}</span>
      </h2>
      <p class="text-xl text-muted-foreground max-w-3xl mx-auto">
        {{ section.section_subtitle }}
      </p>
    </div>

    <div class="flex justify-center">
      <div class="feature-beam-card mx-auto w-full max-w-4xl rounded-3xl border border-border/60 bg-card/70 px-6 py-8 shadow-premium md:px-10 md:py-12">
        <div class="feature-beam-stage" role="img" aria-label="Animated beam showing one input branching to multiple outputs.">
          <svg class="feature-beam-lines" viewBox="0 0 260 480" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="feature-beam-trace" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="hsl(240 100% 70% / 0)"></stop>
                <stop offset="50%" stop-color="hsl(240 100% 70% / 0.95)"></stop>
                <stop offset="100%" stop-color="hsl(250 100% 75% / 0)"></stop>
              </linearGradient>
              <filter id="feature-beam-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
                <feMerge>
                  <feMergeNode in="blur"></feMergeNode>
                  <feMergeNode in="SourceGraphic"></feMergeNode>
                </feMerge>
              </filter>
              <filter id="feature-beam-glow-soft" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="1.6" result="blur"></feGaussianBlur>
                <feMerge>
                  <feMergeNode in="blur"></feMergeNode>
                  <feMergeNode in="SourceGraphic"></feMergeNode>
                </feMerge>
              </filter>
            </defs>

            <path class="beam-base" d="M130 60 C 130 120 130 170 130 220"></path>
            <path class="beam-base" d="M130 220 C 125 270 100 330 70 390"></path>
            <path class="beam-base" d="M130 220 C 128 275 118 335 110 390"></path>
            <path class="beam-base" d="M130 220 C 132 275 142 335 150 390"></path>
            <path class="beam-base" d="M130 220 C 135 270 160 330 190 390"></path>

            <path class="beam-path beam-path-trunk" d="M130 60 C 130 120 130 170 130 220">
              <animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" values="0;0;-540;-540" keyTimes="0;0.06;0.32;1" calcMode="linear"></animate>
              <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.06;0.32;0.36;1" calcMode="linear"></animate>
            </path>
            <path class="beam-path beam-path-branch" d="M130 220 C 125 270 100 330 70 390">
              <animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" values="0;0;-540;-540" keyTimes="0;0.32;0.6;1" calcMode="linear"></animate>
              <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.32;0.38;0.6;0.66;1" calcMode="linear"></animate>
            </path>
            <path class="beam-path beam-path-branch" d="M130 220 C 128 275 118 335 110 390">
              <animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" values="0;0;-540;-540" keyTimes="0;0.32;0.6;1" calcMode="linear"></animate>
              <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.32;0.38;0.6;0.66;1" calcMode="linear"></animate>
            </path>
            <path class="beam-path beam-path-branch" d="M130 220 C 132 275 142 335 150 390">
              <animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" values="0;0;-540;-540" keyTimes="0;0.32;0.6;1" calcMode="linear"></animate>
              <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.32;0.38;0.6;0.66;1" calcMode="linear"></animate>
            </path>
            <path class="beam-path beam-path-branch" d="M130 220 C 135 270 160 330 190 390">
              <animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" values="0;0;-540;-540" keyTimes="0;0.32;0.6;1" calcMode="linear"></animate>
              <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.32;0.38;0.6;0.66;1" calcMode="linear"></animate>
            </path>

            <circle class="beam-dot beam-dot-trunk" r="4">
              <animateMotion dur="6s" repeatCount="indefinite" begin="0s" path="M130 60 C 130 120 130 170 130 220" keyTimes="0;0.32;1" keyPoints="0;1;1" calcMode="linear"></animateMotion>
              <animate attributeName="opacity" dur="6s" repeatCount="indefinite" begin="0s" values="0;1;1;0;0" keyTimes="0;0.05;0.32;0.36;1"></animate>
            </circle>
            <circle class="beam-dot beam-dot-branch" r="4">
              <animateMotion dur="6s" repeatCount="indefinite" begin="0s" path="M130 220 C 125 270 100 330 70 390" keyTimes="0;0.32;0.6;1" keyPoints="0;0;1;1" calcMode="linear"></animateMotion>
              <animate attributeName="opacity" dur="6s" repeatCount="indefinite" begin="0s" values="0;0;1;1;0;0" keyTimes="0;0.32;0.38;0.6;0.66;1"></animate>
            </circle>
            <circle class="beam-dot beam-dot-branch" r="4">
              <animateMotion dur="6s" repeatCount="indefinite" begin="0s" path="M130 220 C 128 275 118 335 110 390" keyTimes="0;0.32;0.6;1" keyPoints="0;0;1;1" calcMode="linear"></animateMotion>
              <animate attributeName="opacity" dur="6s" repeatCount="indefinite" begin="0s" values="0;0;1;1;0;0" keyTimes="0;0.32;0.38;0.6;0.66;1"></animate>
            </circle>
            <circle class="beam-dot beam-dot-branch" r="4">
              <animateMotion dur="6s" repeatCount="indefinite" begin="0s" path="M130 220 C 132 275 142 335 150 390" keyTimes="0;0.32;0.6;1" keyPoints="0;0;1;1" calcMode="linear"></animateMotion>
              <animate attributeName="opacity" dur="6s" repeatCount="indefinite" begin="0s" values="0;0;1;1;0;0" keyTimes="0;0.32;0.38;0.6;0.66;1"></animate>
            </circle>
            <circle class="beam-dot beam-dot-branch" r="4">
              <animateMotion dur="6s" repeatCount="indefinite" begin="0s" path="M130 220 C 135 270 160 330 190 390" keyTimes="0;0.32;0.6;1" keyPoints="0;0;1;1" calcMode="linear"></animateMotion>
              <animate attributeName="opacity" dur="6s" repeatCount="indefinite" begin="0s" values="0;0;1;1;0;0" keyTimes="0;0.32;0.38;0.6;0.66;1"></animate>
            </circle>
          </svg>

          <div class="feature-beam-node feature-beam-input" aria-hidden="true">
            <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 20c2.5-4 13.5-4 16 0"></path>
            </svg>
          </div>

          <div class="feature-beam-hub" aria-hidden="true">
            <span></span>
          </div>

          <div class="feature-beam-output" style="--beam-output-left: 27%; --beam-output-top: 81%;" aria-hidden="true">
            {% lucide "message-square" "w-4 h-4" %}
          </div>
          <div class="feature-beam-output" style="--beam-output-left: 42%; --beam-output-top: 81%;" aria-hidden="true">
            {% lucide "bar-chart-3" "w-4 h-4" %}
          </div>
          <div class="feature-beam-output" style="--beam-output-left: 58%; --beam-output-top: 81%;" aria-hidden="true">
            {% lucide "shield" "w-4 h-4" %}
          </div>
          <div class="feature-beam-output" style="--beam-output-left: 73%; --beam-output-top: 81%;" aria-hidden="true">
            {% lucide "layers" "w-4 h-4" %}
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
