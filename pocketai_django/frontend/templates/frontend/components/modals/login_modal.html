<div
  class="hidden"
  data-login-modal
  data-login-state="closed"
  aria-hidden="true"
>
  <div
    class="fixed inset-0 z-40 bg-black/80 backdrop-blur-[2px] transition-opacity"
    data-login-overlay
  ></div>
  <div
    class="fixed left-1/2 top-1/2 z-50 grid w-full max-w-lg -translate-x-1/2 -translate-y-1/2 gap-4 bg-background p-6 shadow-lg duration-200 ease-out sm:max-w-md sm:rounded-lg login-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="login-modal-title"
    aria-describedby="login-modal-description"
    data-login-content
    tabindex="-1"
  >
    <button
      type="button"
      class="absolute right-4 top-4 rounded-sm p-1 text-neutral-400 transition hover:text-neutral-600 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2"
      aria-label="Close"
      data-login-close
    >
      <svg
        class="h-4 w-4"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M6 18 18 6M6 6l12 12"></path>
      </svg>
      <span class="sr-only">Close</span>
    </button>
    <header class="space-y-2 text-center" data-login-header>
      <h2 id="login-modal-title" class="text-2xl font-bold">
        Welcome Back to <span class="text-gradient-hero">Pocket</span>
      </h2>
      <p id="login-modal-description" class="text-sm text-muted-foreground streaming-text">
        Login to continue
      </p>
    </header>
    <form class="mt-2 space-y-3" data-login-form novalidate>
      <div>
        <label class="mb-2 block text-sm font-medium" for="login-email">Email</label>
        <input
          id="login-email"
          name="email"
          type="email"
          placeholder="you@company.com"
          class="login-input bg-input border border-input w-full rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring"
          autocomplete="email"
          required
          data-login-email-input
        >
      </div>
      <div>
        <label class="mb-2 block text-sm font-medium" for="login-password">Password</label>
        <input
          id="login-password"
          name="password"
          type="password"
          placeholder="••••••••"
          class="login-input bg-input border border-input w-full rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring"
          autocomplete="current-password"
          required
          data-login-password-input
        >
      </div>
      <p class="hidden text-sm text-destructive" role="alert" data-login-error></p>
      <button
        type="submit"
        class="w-full rounded-md bg-gradient-primary px-4 py-2 text-sm font-medium text-white shadow-premium transition-opacity hover:opacity-90 disabled:opacity-70"
        data-login-submit
        data-default-label="Login"
        data-loading-label="Signing in..."
      >
        <span data-login-submit-text>Login</span>
      </button>
      <div class="my-1">
        <div class="flex items-center gap-3">
          <div class="h-px flex-1 bg-border"></div>
          <span class="text-xs text-muted-foreground">OR</span>
          <div class="h-px flex-1 bg-border"></div>
        </div>
      </div>
      <button
        type="button"
        class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-secondary px-4 py-2 text-sm font-medium text-secondary-foreground shadow-sm transition-all duration-300 hover:bg-secondary/80 disabled:pointer-events-none disabled:opacity-70"
        data-login-google
      >
        <span class="inline-flex items-center gap-2">
          <span class="inline-flex h-6 w-6 items-center justify-center rounded-full">
            <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36 16.8 36 11 30.2 11 23S16.8 10 24 10c3.8 0 7.2 1.4 9.8 3.7l5.7-5.7C35.5 4.1 30 2 24 2 12 2 2 12 2 24s10 22 22 22 22-10 22-22c0-1.3-.1-2.5-.4-3.5z"></path>
              <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.4 16.3 18.8 14 24 14c3.8 0 7.2 1.4 9.8 3.7l5.7-5.7C35.5 4.1 30 2 24 2 15.3 2 7.8 7.1 4.2 14.1l2.1.6z"></path>
              <path fill="#4CAF50" d="M24 46c6 0 11.5-2.2 15.6-5.8l-7.2-5.9C30.7 35.7 27.6 37 24 37c-5.2 0-9.7-3.3-11.3-7.9l-6.6 5.1C9.7 40.9 16.3 46 24 46z"></path>
              <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.3 3.8-4.8 6.5-9.3 6.5-5.2 0-9.7-3.3-11.3-7.9l-6.6 5.1C9.7 40.9 16.3 46 24 46c12 0 22-10 22-22 0-1.3-.1-2.5-.4-3.5z"></path>
            </svg>
          </span>
          <span>Continue with Google</span>
        </span>
      </button>
      <div class="text-center text-sm text-muted-foreground">
        Don't have an account?
        <a href="/register" class="text-primary hover:underline" data-login-register>
          Sign up
        </a>
      </div>
    </form>
  </div>
</div>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var modal = document.querySelector("[data-login-modal]");
    if (!modal) {
      return;
    }

    var overlay = modal.querySelector("[data-login-overlay]");
    var content = modal.querySelector("[data-login-content]");
    var form = modal.querySelector("[data-login-form]");
    var emailInput = modal.querySelector("[data-login-email-input]");
    var passwordInput = modal.querySelector("[data-login-password-input]");
    var errorMessage = modal.querySelector("[data-login-error]");
    var submitButton = modal.querySelector("[data-login-submit]");
    var submitText = submitButton ? submitButton.querySelector("[data-login-submit-text]") : null;
    var googleButton = modal.querySelector("[data-login-google]");
    var closeButtons = modal.querySelectorAll("[data-login-close]");
    var registerLink = modal.querySelector("[data-login-register]");
    var triggers = document.querySelectorAll("[data-login-open]");
    var defaultSubmitText = submitButton ? submitButton.getAttribute("data-default-label") || "" : "";
    var loadingSubmitText = submitButton ? submitButton.getAttribute("data-loading-label") || "" : "";
    var lastActiveElement = null;
    var isOpen = false;
    var isSubmitting = false;

    function setError(message) {
      if (!errorMessage) {
        return;
      }
      if (message) {
        errorMessage.textContent = message;
        errorMessage.classList.remove("hidden");
      } else {
        errorMessage.textContent = "";
        errorMessage.classList.add("hidden");
      }
    }

    function setSubmitting(state) {
      isSubmitting = state;
      if (submitButton) {
        submitButton.disabled = state;
      }
      if (googleButton) {
        googleButton.disabled = state;
      }
      if (emailInput) {
        emailInput.disabled = state;
      }
      if (passwordInput) {
        passwordInput.disabled = state;
      }
      if (submitText) {
        submitText.textContent = state ? loadingSubmitText || defaultSubmitText : defaultSubmitText;
      }
    }

    function resetForm(prefillEmail) {
      if (!form) {
        return;
      }
      form.reset();
      if (typeof prefillEmail === "string" && emailInput) {
        emailInput.value = prefillEmail;
      }
      setError(null);
      setSubmitting(false);
    }

    function openModal(prefillEmail) {
      if (isOpen) {
        resetForm(prefillEmail);
        if (emailInput) {
          emailInput.focus();
        }
        return;
      }
      lastActiveElement = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      resetForm(prefillEmail);
      modal.classList.remove("hidden");
      modal.setAttribute("data-login-state", "open");
      modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("overflow-hidden");
      window.setTimeout(function () {
        if (emailInput) {
          emailInput.focus();
        } else if (content) {
          content.focus();
        }
      }, 50);
      isOpen = true;
    }

    function closeModal() {
      if (!isOpen) {
        return;
      }
      modal.classList.add("hidden");
      modal.setAttribute("data-login-state", "closed");
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("overflow-hidden");
      isOpen = false;
      setTimeout(function () {
        if (lastActiveElement) {
          lastActiveElement.focus();
        }
        lastActiveElement = null;
      }, 50);
    }

    if (overlay) {
      overlay.addEventListener("click", function () {
        closeModal();
      });
    }

    closeButtons.forEach(function (button) {
      button.addEventListener("click", function (event) {
        event.preventDefault();
        closeModal();
      });
    });

    if (registerLink) {
      registerLink.addEventListener("click", function () {
        closeModal();
      });
    }

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && isOpen) {
        closeModal();
      }
    });

    triggers.forEach(function (trigger) {
      trigger.addEventListener("click", function (event) {
        event.preventDefault();
        var email = trigger.getAttribute("data-login-email");
        openModal(email || "");
      });
    });

    if (form && emailInput && passwordInput) {
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (isSubmitting) {
          return;
        }
        var email = emailInput.value.trim();
        var password = passwordInput.value;
        if (!email || !password) {
          setError("Email and password are required.");
          if (!email && emailInput) {
            emailInput.focus();
          } else if (!password && passwordInput) {
            passwordInput.focus();
          }
          return;
        }
        setError(null);
        setSubmitting(true);

        var submitDetail = {
          email: email,
          password: password,
          close: closeModal,
          setError: function (message) {
            setError(message);
            setSubmitting(false);
          },
          resolve: function () {
            setSubmitting(false);
            closeModal();
            modal.dispatchEvent(
              new CustomEvent("loginmodal:success", {
                detail: { email: email, password: password },
              })
            );
          },
          reject: function (message) {
            setError(message);
            setSubmitting(false);
          },
        };

        var submitEvent = new CustomEvent("loginmodal:submit", {
          detail: submitDetail,
          cancelable: true,
        });

        var prevented = !modal.dispatchEvent(submitEvent);

        if (!prevented) {
          window.setTimeout(function () {
            submitDetail.resolve();
          }, 300);
        }
      });
    }
  });
</script>
