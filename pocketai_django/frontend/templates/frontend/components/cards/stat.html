<div class="rounded-2xl border border-border/60 bg-card/70 p-6 shadow-soft">
  <p class="text-xs uppercase tracking-wide text-muted-foreground mb-3">{{ title }}</p>
  <p class="text-3xl font-semibold text-foreground">{{ value }}</p>

  {% endif %}
</div>
